<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C1445"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="diagGrad" x1="80" y1="440" x2="432" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="centerGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0C1445" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <!-- Subtle top glow overlay -->
  <rect width="512" height="512" rx="96" fill="url(#centerGlow)"/>

  <!-- Left vertical stroke -->
  <rect x="80" y="72" width="70" height="368" rx="10" fill="white"/>

  <!-- Right vertical stroke -->
  <rect x="362" y="72" width="70" height="368" rx="10" fill="white"/>

  <!-- Diagonal stroke in blue gradient (N cross) -->
  <polygon points="80,72 150,72 432,440 362,440" fill="url(#diagGrad)" filter="url(#glowFilter)"/>

  <!-- Sparkle at top-right of diagonal — suggests insight/AI -->
  <circle cx="400" cy="100" r="10" fill="#BAE6FD" opacity="0.9"/>
  <circle cx="430" cy="80"  r="5"  fill="white"   opacity="0.7"/>
  <circle cx="375" cy="118" r="5"  fill="#93C5FD"  opacity="0.6"/>
</svg>
